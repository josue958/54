<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOKARHE — Planeador de Ciclos y PDAs</title>
  <meta name="description" content="Planeador de Ciclos Escolares y PDAs. Gestiona ciclos, materias, días inhábiles y cronograma de cobertura.">
  <link rel="stylesheet" href="css/styles.css">

  <!-- sql.js (SQLite en WebAssembly) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"
          crossorigin="anonymous"></script>
</head>
<body>

<!-- Splash de carga -->
<div id="splash">
  <div style="font-family:'Montserrat',sans-serif;font-size:26px;font-weight:800;color:#C9A646;letter-spacing:2px">JOKARHE</div>
  <div class="spinner"></div>
  <p style="color:#64748b;font-size:13px">Iniciando base de datos SQLite…</p>
</div>

<!-- Shell de la app -->
<div class="app-layout">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-wrapper">📋</div>
      <div class="sidebar-logo-text">
        <h1>JOKARHE</h1>
        <span class="sub-brand">CORE</span>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">
        <a href="#dashboard" class="nav-item" data-route="dashboard" onclick="navigate('#dashboard')">
          <span class="nav-item-icon">🗓️</span> Cronograma
        </a>
        <a href="#cycles" class="nav-item" data-route="cycles" onclick="navigate('#cycles')">
          <span class="nav-item-icon">⚙️</span> Ciclos Escolares
        </a>
        <a href="#subjects" class="nav-item" data-route="subjects" onclick="navigate('#subjects')">
          <span class="nav-item-icon">📚</span> Materias
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main-content">
    <header class="topbar">
      <h2>Planeador de Ciclos y PDAs</h2>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="handleExport()" title="Exportar base de datos">💾 DB</button>
        <button class="btn btn-ghost btn-sm" onclick="handleImport()" title="Importar base de datos">📂 Importar</button>
        <button class="btn btn-ghost btn-sm" onclick="handleReset()" title="Restablecer a datos de ejemplo">🔄 Reset</button>
      </div>
    </header>
    
    <div class="page-content" id="main-content">
      <!-- Renderizado por app.js -->
    </div>
  </main>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Scripts: helpers → db → api → vistas → export → app -->
<script src="js/helpers.js"></script>
<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/views/cycles.js"></script>
<script src="js/views/subjects.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="js/excelExport.js"></script>
<script src="js/app.js"></script>

</body>
</html>
